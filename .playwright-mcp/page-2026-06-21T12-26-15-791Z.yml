        - heading "FAQs" [level=2] [ref=e180]
        - generic [ref=e181]:
          - button "What gases does Swarakshit detect? +" [ref=e182] [cursor=pointer]:
            - text: What gases does Swarakshit detect?
            - generic [ref=e183]: +
          - paragraph [ref=e185]: Swarakshit detects all combustible gases including LPG, PNG, CNG, methane, propane, butane and other hydrocarbons. It is NOT designed to detect CO (carbon monoxide) — for CO, you need a dedicated CO alarm.
        - generic [ref=e186]:
          - button "What does LERC certification mean? +" [ref=e187] [cursor=pointer]:
            - text: What does LERC certification mean?
            - generic [ref=e188]: +
          - paragraph [ref=e190]: LERC (Liquefied Petroleum Gas Equipment Research Centre) is India's premier government-recognized body for testing and certifying LPG safety equipment. LERC certification means the device has been independently tested for accuracy, sensitivity, and durability — the gold standard in India.
        - generic [ref=e191]:
          - button "How long does the battery last? +" [ref=e192] [cursor=pointer]:
            - text: How long does the battery last?
            - generic [ref=e193]: +
          - paragraph [ref=e195]: The built-in rechargeable battery lasts 8–10 hours of continuous use. For typical home use (5–10 minute daily checks), the battery lasts several weeks between charges. USB charging takes approximately 2 hours to full.
        - generic [ref=e196]:
          - button "Can I use it for commercial kitchens? +" [ref=e197] [cursor=pointer]:
            - text: Can I use it for commercial kitchens?
            - generic [ref=e198]: +
          - paragraph [ref=e200]: Swarakshit is designed first for homes and kitchens. It may also be useful in selected small commercial kitchen setups where regular combustible gas checks are needed. If you have a specialized or bulk requirement, contact us before ordering so we can guide you properly.
        - generic [ref=e201]:
          - button "What is the warranty and return policy? +" [ref=e202] [cursor=pointer]:
            - text: What is the warranty and return policy?
            - generic [ref=e203]: +
          - paragraph [ref=e205]: Every Swarakshit device comes with a 1-year manufacturer's warranty and a 30-day no-questions-asked return policy. Contact us at info@rakshit.net.in or call 9529154548.
        - generic [ref=e206]:
          - button "How often should I test for gas leaks? +" [ref=e207] [cursor=pointer]:
            - text: How often should I test for gas leaks?
            - generic [ref=e208]: +
          - paragraph [ref=e210]: Weekly — around LPG cylinder and rubber pipe connections. Monthly — around all gas appliances including geysers. Immediately — after any new appliance installation or if you smell even a faint gas odour.
        - generic [ref=e211]:
          - button "Is it safe to use if I already smell gas? +" [ref=e212] [cursor=pointer]:
            - text: Is it safe to use if I already smell gas?
            - generic [ref=e213]: +
          - paragraph [ref=e215]: If you already smell strong gas, DO NOT use any electrical device including Swarakshit. Immediately turn off the main gas valve, open all windows, evacuate, and call your gas agency. Use Swarakshit for routine preventive checks when no visible leak is apparent.
