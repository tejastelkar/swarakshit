          - generic [ref=e712]: The built-in rechargeable battery lasts 8–10 hours of continuous use. For typical home use (5–10 minute daily checks), the battery lasts several weeks between charges. USB charging takes approximately 2 hours to full.
        - generic [ref=e713]:
          - button "Can I use it for commercial kitchens? +" [ref=e714] [cursor=pointer]:
            - generic [ref=e715]: Can I use it for commercial kitchens?
            - generic [ref=e716]: +
          - generic [ref=e717]: Yes. Swarakshit is used in hotels, restaurants, cloud kitchens, gas stations, and industrial facilities across India. LERC certification makes it compliant with safety audit requirements. We offer bulk pricing — WhatsApp us for commercial orders.
        - generic [ref=e718]:
          - button "What is the warranty and return policy? +" [ref=e719] [cursor=pointer]:
            - generic [ref=e720]: What is the warranty and return policy?
            - generic [ref=e721]: +
          - generic [ref=e722]: Every Swarakshit device comes with a 1-year manufacturer's warranty and a 30-day no-questions-asked return policy. Contact us at info@rakshit.net.in or call 9529154548.
        - generic [ref=e723]:
          - button "How often should I test for gas leaks? +" [ref=e724] [cursor=pointer]:
            - generic [ref=e725]: How often should I test for gas leaks?
            - generic [ref=e726]: +
          - generic [ref=e727]: Weekly — around LPG cylinder and rubber pipe connections. Monthly — around all gas appliances including geysers. Immediately — after any new appliance installation or if you smell even a faint gas odour.
        - generic [ref=e728]:
          - button "Is it safe to use if I already smell gas? +" [ref=e729] [cursor=pointer]:
            - generic [ref=e730]: Is it safe to use if I already smell gas?
            - generic [ref=e731]: +
          - generic [ref=e732]: If you already smell strong gas, DO NOT use any electrical device including Swarakshit. Immediately turn off the main gas valve, open all windows, evacuate, and call your gas agency. Use Swarakshit for routine preventive checks when no visible leak is apparent.
