    - generic [ref=e615]:
      - heading "Frequently Asked Questions" [level=2] [ref=e616]
      - generic [ref=e617]:
        - generic [ref=e618]:
          - button "What gases does Swarakshit detect? +" [ref=e619] [cursor=pointer]:
            - generic [ref=e620]: What gases does Swarakshit detect?
            - generic [ref=e621]: +
          - generic [ref=e622]: Swarakshit detects all combustible gases including LPG, PNG, CNG, methane, propane, butane and other hydrocarbons. It is NOT designed to detect CO (carbon monoxide) — for CO, you need a dedicated CO alarm.
        - generic [ref=e623]:
          - button "What does LERC certification mean? +" [ref=e624] [cursor=pointer]:
            - generic [ref=e625]: What does LERC certification mean?
            - generic [ref=e626]: +
          - generic [ref=e627]: LERC (Liquefied Petroleum Gas Equipment Research Centre) is India's premier government-recognized body for testing and certifying LPG safety equipment. LERC certification means the device has been independently tested for accuracy, sensitivity, and durability — the gold standard in India.
        - generic [ref=e628]:
          - button "How long does the battery last? +" [ref=e629] [cursor=pointer]:
            - generic [ref=e630]: How long does the battery last?
            - generic [ref=e631]: +
          - generic [ref=e632]: The built-in rechargeable battery lasts 8–10 hours of continuous use. For typical home use (5–10 minute daily checks), the battery lasts several weeks between charges. USB charging takes approximately 2 hours to full.
        - generic [ref=e633]:
          - button "Can I use it for commercial kitchens? +" [ref=e634] [cursor=pointer]:
            - generic [ref=e635]: Can I use it for commercial kitchens?
            - generic [ref=e636]: +
          - generic [ref=e637]: Swarakshit is designed first for homes and kitchens. It may also be useful in selected small commercial kitchen setups where regular combustible gas checks are needed. If you have a specialized or bulk requirement, contact us before ordering so we can guide you properly.
        - generic [ref=e638]:
          - button "What is the warranty and return policy? +" [ref=e639] [cursor=pointer]:
            - generic [ref=e640]: What is the warranty and return policy?
            - generic [ref=e641]: +
          - generic [ref=e642]: Every Swarakshit device comes with a 1-year manufacturer's warranty and a 30-day no-questions-asked return policy. Contact us at info@rakshit.net.in or call 9529154548.
        - generic [ref=e643]:
          - button "How often should I test for gas leaks? +" [ref=e644] [cursor=pointer]:
            - generic [ref=e645]: How often should I test for gas leaks?
            - generic [ref=e646]: +
          - generic [ref=e647]: Weekly — around LPG cylinder and rubber pipe connections. Monthly — around all gas appliances including geysers. Immediately — after any new appliance installation or if you smell even a faint gas odour.
        - generic [ref=e648]:
          - button "Is it safe to use if I already smell gas? +" [ref=e649] [cursor=pointer]:
            - generic [ref=e650]: Is it safe to use if I already smell gas?
            - generic [ref=e651]: +
          - generic [ref=e652]: If you already smell strong gas, DO NOT use any electrical device including Swarakshit. Immediately turn off the main gas valve, open all windows, evacuate, and call your gas agency. Use Swarakshit for routine preventive checks when no visible leak is apparent.
