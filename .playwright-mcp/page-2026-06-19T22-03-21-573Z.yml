            - paragraph
            - heading "Our History" [level=3] [ref=e72]
            - paragraph [ref=e73]: Situated amidst the sylvan surroundings in the Garden City of Bangalore in India, LPG Equipment Research Centre holds a very strategic position in the technical up gradation, safety and quality assurance of LPG Equipment in the country.
            - paragraph
            - paragraph [ref=e74]: LPG though the most preferred and sought after cooking fuel used in 142 million Indian household which covers nearly half the population of the country, LPG is a hazardous fuel unless handled in a safe manner. The 1980’s saw a lot of domestic accidents due to poor quality of LPG equipments used as there were no proper quality control measures to monitor the same. LERC was conceptualized by the Three Oil Majors of India and was set up in 1990 with a purpose to develop quality equipments for usage with LPG and suitable quality control measures so as to ensure safety to customers. LERC commenced operation in April 1990 and was registered as a society under Karnataka Societies Registration Act 1960 in January 1993.
            - paragraph
            - paragraph [ref=e75]: LERC is a unique collaborative joint venture of the 3 Oil Major Fortune 500 companies viz Indian Oil Corporation Limited, Bharat Petroleum Corporation Ltd and Hindustan Petroleum Corporation Limited with a stake holding in the ratio of 50:25:25 respectively, which do not have a parallel anywhere in the world. The Governing Body / Executive Committee of LERC comprises of Board Level Executives of the Three Major Oil Companies along with External Agencies like Chief Controller of Explosives, PCRA, Petrofed Federation of India, Bureau of Indian Standards, Indian Institute of Petroleum. The day to day activities of LERC is monitored by Oil Industry Technical Committee which comprises of a team of technical members from all the Three Major Oil Companies.
            - paragraph
            - paragraph [ref=e76]: This centre has been recognized by the Department of Scientific and Industrial Research, Govt. of India (DSIR). The testing labs at LERC are recognized by National Accreditation Board for Laboratories (NABL) and Bureau of Indian Standards (BIS). LERC is also a member of various Committees in Bureau of Indian Standards and is actively involved in the standards developed for various LPG equipments.
