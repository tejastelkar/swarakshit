[environments.dev]
store = "w1mru4-mj.myshopify.com"

# Safe default: use `shopify theme dev` or `shopify theme push --unpublished`
# unless you intentionally target a specific theme ID.
#
# Current remote themes as of 2026-06-20:
# live: 188972695869 (Dawn)
# unpublished: 188952576317 (Horizon)
# development: 188971123005 (Development (456b51-Tejass-MacBook-Air))

ignore = [
  ".agents/*",
  "*.zip",
  "*.mp4",
  "*.mov",
  "*.log",
  "*.tmp",
  "*.bak",
  "*.backup"
]

[environments.existing_live]
store = "w1mru4-mj.myshopify.com"
